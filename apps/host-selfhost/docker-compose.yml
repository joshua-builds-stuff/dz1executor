# One-command self-hosted Executor.
#
#   docker compose up -d --build      # build the image and start
#   open http://localhost:4788        # create the admin account (first-run)
#
# Executor and its integrated AgentRegistry control plane start together. Named
# volumes persist Executor's libSQL data and AgentRegistry's PostgreSQL catalog.
#
# No configuration is required: a bare `docker compose up` boots a working
# instance and walks you through creating the admin account in the browser.
# Optional settings live in .env (see .env.example) — most importantly
# EXECUTOR_WEB_BASE_URL when serving behind a domain / TLS.

services:
  executor:
    build:
      # Build context is the repo root: the Bun workspace install needs every member.
      context: ../..
      dockerfile: apps/host-selfhost/Dockerfile
    image: executor-selfhost
    restart: unless-stopped
    ports:
      - "4788:4788"
    env_file:
      - path: .env
        required: false
    environment:
      AGENTREGISTRY_URL: ${AGENTREGISTRY_URL:-http://agentregistry:8080}
    volumes:
      - executor-data:/data
    depends_on:
      agentregistry:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:4788/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  agentregistry-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentregistry
      POSTGRES_USER: agentregistry
      POSTGRES_PASSWORD: agentregistry
    volumes:
      - agentregistry-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentregistry -d agentregistry"]
      interval: 5s
      timeout: 5s
      retries: 10

  agentregistry:
    # Published image plus git — see agentregistry.Dockerfile for why.
    build:
      context: .
      dockerfile: agentregistry.Dockerfile
      args:
        AGENTREGISTRY_VERSION: ${AGENTREGISTRY_VERSION:-v0.4.0}
    image: executor-agentregistry
    restart: unless-stopped
    environment:
      AGENT_REGISTRY_DATABASE_URL: postgres://agentregistry:agentregistry@agentregistry-db:5432/agentregistry?sslmode=disable
      AGENT_REGISTRY_SERVER_ADDRESS: :8080
      AGENT_REGISTRY_AGENT_GATEWAY_PORT: "21212"
      AGENT_REGISTRY_MCP_PORT: "31313"
      AGENT_REGISTRY_ENABLE_REGISTRY_VALIDATION: "false"
      AGENT_REGISTRY_PLATFORM_MODE: docker
      AGENT_REGISTRY_MCP_REGISTRY_COMPAT_ENABLED: "true"
    ports:
      - "12121:8080"
      - "31313:31313"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
    depends_on:
      agentregistry-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/v0/ping"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  executor-data:
  agentregistry-data:
